<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Air Monitor Settings</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: #f5f5f5;
    }

    .panel {
      background: white;
      max-width: 500px;
      padding: 25px;
      border-radius: 8px;
    }

    label {
      display: block;
      margin-top: 18px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
    }

    button {
      margin-top: 20px;
      padding: 10px 18px;
    }
  </style>
</head>

<body>

<p><a href="/">← Dashboard</a></p>

<div class="panel">

<h2>Settings</h2>

<label>
  Poll seconds
  <input id="poll_seconds" type="number" step="0.5"
         value="{{ settings.poll_seconds }}">
</label>

<label>
  Warm-up seconds
  <input id="warmup_seconds" type="number"
         value="{{ settings.warmup_seconds }}">
</label>

<label>
  Default chart hours
  <input id="chart_hours" type="number" step="0.5"
         value="{{ settings.chart_hours }}">
</label>

<button onclick="saveSettings()">Save</button>

<p id="result"></p>

</div>

<script>
async function saveSettings() {
  const payload = {
    poll_seconds:
      parseFloat(document.getElementById("poll_seconds").value),

    warmup_seconds:
      parseFloat(document.getElementById("warmup_seconds").value),

    chart_hours:
      parseFloat(document.getElementById("chart_hours").value)
  };

  const response = await fetch("/api/settings", {
    method: "PUT",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(payload)
  });

  const data = await response.json();

  document.getElementById("result").textContent =
    "Saved. Poll interval: " + data.poll_seconds + " seconds.";
}
</script>

</body>
</html>
